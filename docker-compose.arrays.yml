# Runs the tests of more arrays in the same daemon, against a throwaway lab made of empty disks.
#
#     docker compose -f docker-compose.arrays.yml up --build --abort-on-container-exit --exit-code-from tests
#     docker compose -f docker-compose.arrays.yml down -v
name: snapraid-lab-arrays
services:
  tests:
    build:
      context: .
      additional_contexts:
        daemon: ${DAEMON_SRC:-../snapraid-daemon}
    container_name: snapraid-lab-arrays
    privileged: true
    init: true
    environment:
      LAB_PRESET: "blank"
      LAB_DATA_DISKS: "5"
      LAB_PARITY_DISKS: "2"
      LAB_SPARE_DISKS: "1"
      LAB_DISK_SIZE_MB: "256"
      LAB_RUN_TESTS: "1"
      LAB_TEST: "multi-array-test.sh"
    volumes:
      - arrayslab:/lab
      - ${DAEMON_SRC:-../snapraid-daemon}/commander:/ui/commander
      - ${DAEMON_SRC:-../snapraid-daemon}/brutale:/ui/brutale
      - ${DAEMON_SRC:-../snapraid-daemon}/quiet:/ui/quiet
volumes:
  arrayslab:
